<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Tidings — early access</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Tidings remembers the birthdays, anniversaries, and holidays that matter — and helps you send something warm.">
<script>
  // Send phones straight to their store listing — no code-retrieval webpage in the
  // way. The 90-day early-access code lives IN the app now (paywall + Settings CTA,
  // same dispenser pool as tidings.family/unlock), so a marketing text should land
  // people on an install prompt, not a webpage. Desktop/unknown gets the visible
  // fallback below instead of a guess.
  //
  // Referral forwarding: a referral link is /get/?ref=<CODE>. We pass <CODE> into the Google Play
  // `referrer` param — Play delivers that string to the app via the Install Referrer API on first
  // launch, so a referral survives a COLD Android install with no re-tap. The Android app reads it
  // as `ref=<CODE>` (ReferralStore.parseRef). Apple has no equivalent install-referrer, so iOS
  // can't carry ref through a fresh App Store install — that path stays as-is.
  // Campaign click counter: a marketing link is /get/?c=<slug> (5 known slugs), SEPARATE from
  // ?ref= above (source attribution, not person-to-person referral credit — a link can carry
  // either, both, or neither). Fire-and-forget: never blocks or delays the redirect below, and a
  // failure here is silently swallowed — this is a nice-to-have count, not something a real visitor
  // should ever notice.
  (function () {
    var slugs = ["ads-meta", "ads-google", "sms", "email", "organic"];
    var c = (new URLSearchParams(location.search).get("c") || "").trim().toLowerCase();
    if (slugs.indexOf(c) === -1) return;
    var body = JSON.stringify({ c: c });
    try {
      if (navigator.sendBeacon) {
        navigator.sendBeacon(
          "https://tidings-backend-func.azurewebsites.net/api/campaign/click",
          new Blob([body], { type: "application/json" }));
      } else {
        fetch("https://tidings-backend-func.azurewebsites.net/api/campaign/click", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: body, keepalive: true
        }).catch(function () {});
      }
    } catch (e) {}
  })();

  (function () {
    var raw = (new URLSearchParams(location.search).get("ref") || "").trim().toUpperCase();
    var ref = /^[A-Z2-9]{8}$/.test(raw) ? raw : "";  // validate; never forward garbage
    var play = "https://play.google.com/store/apps/details?id=com.animumrege.tidings"
      + (ref ? "&referrer=" + encodeURIComponent("ref=" + ref) : "");
    // Keep the visible Google Play badge in sync for desktop/manual taps.
    document.addEventListener("DOMContentLoaded", function () {
      var a = document.getElementById("gp-link");
      if (a) a.setAttribute("href", play);
    });
    var ua = navigator.userAgent || "";
    var isIOS = /iphone|ipad|ipod/i.test(ua) || (/mac/i.test(ua) && navigator.maxTouchPoints > 1);
    var isAndroid = /android/i.test(ua);
    if (isIOS) location.replace("https://apps.apple.com/app/id6790977142");
    else if (isAndroid) location.replace(play);
  })();
</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf7f2; --text: #2d2a26; --muted: #6b6660; --accent: #c8743c;
  }
  @media (prefers-color-scheme: dark) { :root { --bg: #211f1c; --text: #f0ece5; --muted: #b9b2a8; } }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); text-align: center; padding: 2rem 1.25rem;
  }
  main { max-width: 26rem; }
  h1 { font-size: 2.2rem; margin: 0 0 .6rem; letter-spacing: -.02em; }
  p { font-size: 1.05rem; line-height: 1.5; color: var(--muted); margin: 0 0 1.75rem; }
  .badges { display: flex; gap: .9rem; justify-content: center; flex-wrap: wrap; }
  .badges img.appstore { height: 52px; }
  .badges img.googleplay { height: 78px; margin: -13px 0; }
  .hint { font-size: .88rem; color: var(--muted); margin-top: 1.75rem; }
</style>
</head>
<body>
<main>
  <h1>Tidings</h1>
  <p>You've been invited to try Tidings early — never forget a birthday or occasion again. Download it below, then open the app to grab your free 90 days.</p>
  <div class="badges">
    <a href="https://apps.apple.com/app/id6790977142" aria-label="Download on the App Store">
      <img class="appstore" src="../assets/badges/app-store-badge.svg" alt="Download on the App Store">
    </a>
    <a id="gp-link" href="https://play.google.com/store/apps/details?id=com.animumrege.tidings" aria-label="Get it on Google Play">
      <img class="googleplay" src="../assets/badges/google-play-badge.png" alt="Get it on Google Play">
    </a>
  </div>
  <p class="hint">Already installed? Open Tidings — your free 90 days is waiting on the Settings screen.</p>
</main>
</body>
</html>
